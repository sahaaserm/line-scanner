<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LIFF Barcode Scanner V4</title>
  
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; padding: 12px; margin: 0; }
    .container { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 480px; margin: auto; }
    h2 { color: #00b900; margin-top: 0; text-align: center; font-size: 18px; }
    
    #scanner-box { width: 100%; height: 200px; border: 2px dashed #00b900; background: #000; position: relative; border-radius: 8px; overflow: hidden; }
    #interactive.viewport { width: 100%; height: 100%; }
    #interactive.viewport video { width: 100%; height: 100%; object-fit: cover; }
    canvas.drawingBuffer { display: none; }

    .status-box { background: #e8f5e9; padding: 10px; border-radius: 6px; color: #2e7d32; font-weight: bold; margin-top: 10px; font-size: 13px; text-align: center; }
    
    .form-group { text-align: left; margin-top: 12px; }
    .form-group label { font-size: 13px; font-weight: bold; color: #333; display: block; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 18px; background-color: #fff; -webkit-appearance: none; }
    
    .btn-send { width: 100%; padding: 14px; background: #00b900; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; }
    .btn-reset { width: 100%; padding: 10px; background: #666; color: white; border: none; border-radius: 6px; font-size: 14px; margin-top: 8px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h2>📷 สแกนรับสินค้าเข้า</h2>
  
  <!-- กรอบกล้อง -->
  <div id="scanner-box">
    <div id="interactive" class="viewport"></div>
  </div>

  <div id="status" class="status-box">กำลังเปิดกล้อง...</div>

  <!-- ฟอร์มกรอกข้อมูล -->
  <div class="form-group">
    <label>รหัสบาร์โค้ด:</label>
    <input type="tel" id="barcodeResult" placeholder="สแกนหรือพิมพ์รหัสบาร์โค้ด">
  </div>
  <div class="form-group">
    <label>จำนวนที่รับเข้า (ชิ้น):</label>
    <input type="tel" id="qtyInput" value="1">
  </div>
  <div class="form-group">
    <label>ราคารวมจ่ายทั้งหมด (บาท):</label>
    <input type="tel" id="priceInput" placeholder="ระบุยอดเงิน เช่น 2500">
  </div>

  <button class="btn-send" onclick="submitData()">📥 บันทึกส่งเข้าแชต</button>
  <button class="btn-reset" onclick="resetScanner()">🔄 เปิดกล้องสแกนใหม่</button>
</div>

<script>
  const MY_LIFF_ID = "2011277464-MBYJYeu1"; 
  let isScanned = false;

  window.onload = function() {
    liff.init({ liffId: MY_LIFF_ID }).then(() => {
      if (!liff.isLoggedIn()) {
        liff.login();
      } else {
        document.getElementById("status").innerText = "ส่องกล้องไปที่บาร์โค้ดได้เลย";
        startScanner();
      }
    }).catch(err => {
      document.getElementById("status").innerText = "❌ LIFF Error: " + err.message;
    });
  };

  function startScanner() {
    isScanned = false;
    document.getElementById("scanner-box").style.display = "block"; // แสดงกล้อง
    
    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector('#interactive'),
        constraints: {
          facingMode: "environment",
          width: { min: 640 },
          height: { min: 480 }
        }
      },
      locator: { patchSize: "medium", halfSample: true },
      numOfWorkers: 2,
      decoder: {
        readers: ["ean_reader", "code_128_reader"]
      }
    }, function(err) {
      if (err) return document.getElementById("status").innerText = "❌ เปิดกล้องไม่สำเร็จ: " + err;
      Quagga.start();
    });

    Quagga.onDetected(function(result) {
      if (isScanned) return;
      
      if (result && result.codeResult && result.codeResult.code) {
        let code = result.codeResult.code;
        if (code.length >= 8) {
          isScanned = true;
          
          // หยุดกล้องและซ่อนช่องกล้องทันทีเพื่อคืนแป้นพิมพ์
          Quagga.stop();
          document.getElementById("scanner-box").style.display = "none";
          
          document.getElementById("barcodeResult").value = code;
          document.getElementById("status").innerText = "✅ สแกนสำเร็จ! พิมพ์จำนวนและราคาด้านล่างได้เลย";
        }
      }
    });
  }

  function resetScanner() {
    document.getElementById("barcodeResult").value = "";
    document.getElementById("priceInput").value = "";
    document.getElementById("qtyInput").value = "1";
    document.getElementById("status").innerText = "ส่องกล้องไปที่บาร์โค้ดได้เลย";
    startScanner();
  }

  function submitData() {
    let code = document.getElementById("barcodeResult").value;
    let qty = document.getElementById("qtyInput").value;
    let price = document.getElementById("priceInput").value;

    if (!code) {
      alert("⚠️ กรุณาสแกนหรือพิมพ์รหัสบาร์โค้ด");
      return;
    }
    if (!qty || qty <= 0) {
      alert("⚠️ กรุณาระบุจำนวนสินค้าให้ถูกต้อง");
      return;
    }
    if (!price || price < 0) {
      alert("⚠️ กรุณาระบุราคารวมจ่ายให้ถูกต้อง");
      return;
    }

    let msg = `${code}*${qty}*${price}`;

    if (liff.isInClient()) {
      liff.sendMessages([{ type: 'text', text: msg }])
        .then(() => liff.closeWindow())
        .catch(err => alert("❌ ส่งไม่สำเร็จ: " + err.message));
    } else {
      alert("ข้อความที่จะส่ง: " + msg);
    }
  }
</script>

</body>
</html>
